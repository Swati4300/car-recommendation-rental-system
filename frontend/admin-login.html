<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | The Mob Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="dark-theme">
    <div class="container" style="height: 100vh; display: flex; align-items: center; justify-content: center;">
        <div class="modal-content glass" style="max-width: 400px; width: 100%; animation: fadeIn 0.5s ease-out;">
            <div style="text-align: center; margin-bottom: 30px;">
                <a href="index.html" class="logo">The Mob<span> Hub Admin</span></a>
                <p style="color: var(--text-muted); margin-top: 10px;">Please login to access the dashboard</p>
            </div>
            <form id="admin-login-form">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="admin-username" placeholder="Enter username" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="admin-password" placeholder="Enter password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Login to Panel</button>
            </form>
            <div id="login-error" style="color: var(--accent-color); text-align: center; margin-top: 20px; display: none;"></div>
        </div>
    </div>

    <script>
        document.getElementById('admin-login-form').onsubmit = async (e) => {
            e.preventDefault();
            const username = document.getElementById('admin-username').value;
            const password = document.getElementById('admin-password').value;
            const errorEl = document.getElementById('login-error');

            try {
                const res = await fetch('http://127.0.0.1:5000/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('adminToken', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = 'admin-dashboard.html';
                } else {
                    errorEl.innerText = data.error;
                    errorEl.style.display = 'block';
                }
            } catch (err) {
                errorEl.innerText = "Connection failed. Is the server running?";
                errorEl.style.display = 'block';
            }
        };
    </script>
</body>
</html>
